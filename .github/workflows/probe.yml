name: Probe legacy sources

on:
  push:
    paths: ["tools/probe_legacy.py", ".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install certifi
      - run: python tools/probe_legacy.py
